spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:eventia-db}:${DB_PORT:5432}/${DB_NAME:eventia}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false

security:
  jwt:
    key-private: ${JWT_SECRET}
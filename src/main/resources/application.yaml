server:
  port: 8080

spring:
  application:
    name: Eventia

  profiles:
    default: dev

  datasource:
    # Base de datos H2 en archivo.
    url: jdbc:h2:file:./data/eventia
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
      path: /h2-console


app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://eventia-frontend-eight.vercel.app}

security:
  jwt:
    # Obligatorio definir JWT_SECRET. El perfil dev aporta un valor solo local.
    key-private: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:86400000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com:
      backend:
        eventia: INFO
    # Para la demostración, subir temporalmente a DEBUG:
    # logging.level.org.springframework.security: DEBUG
    org:
      springframework:
        security: INFO
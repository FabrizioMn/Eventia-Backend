server:
  port: 8080

spring:
  application:
    name: Eventia

  datasource:
    # Base de datos H2 en archivo.
    url: jdbc:h2:file:./data/eventia
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console


security:
  jwt:
    key-private: 964ffdb5e95797ad2be8a036924d97a1df90a004b69e25093959be7d5104601b # <- DATOS DE PRUEBA
    expiration: 86400000 # <- DATOS DE PRUEBA

logging:
  level:
    com:
      backend:
        eventia: DEBUG